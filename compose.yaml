services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: faultline
      POSTGRES_PASSWORD: faultline
      POSTGRES_DB: faultline
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - faultline_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultline -d faultline"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  faultline_pg:
