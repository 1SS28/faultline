name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:site
      - run: npm run build:sdk
      - run: npm test
      - run: npm run demo
      - run: npm run faultline -- run timeout-after-commit resilient
      - run: npm run evaluate -- --provider fixture --agent resilient --trials 2
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      # The Lambda functions bundle the app's own code, so both packages are installed.
      - run: npm ci
      - run: npm ci
        working-directory: infra
      - run: npm run check
        working-directory: infra
      # Builds the CloudFormation template and both function bundles without touching AWS.
      - run: npx cdk synth --quiet
        working-directory: infra
